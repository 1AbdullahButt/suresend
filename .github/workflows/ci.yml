name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and runs tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests and e2e never call a live model: they use fixtures and the saved responses in data/ai-cache.
      AI_MODE: saved
      # Matches the eval selection in evals/results.md (D-017/D-019); saved lookups also try every provider (D-018).
      AI_PROVIDER: groq
      AI_FALLBACK_PROVIDER: gemini
    steps:
      # Actions pinned to commit SHAs (the v4 tags at the time of pinning).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Saved-response replay reproduces the golden decisions
        run: pnpm eval --saved
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E demo flow (saved mode)
        run: pnpm e2e
